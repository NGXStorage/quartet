stages:
  - lint
  - test
  - build
  - envtest

variables:
  GO_VERSION: "1.27.4"

default:
  image: golang:${GO_VERSION}
  tags:
    - linux
    - docker
    - shared
  cache:
    key: go-mod-{{ checksum "go.sum" }}
    paths:
      - .gocache/mod
  before_script:
 # Vendor model: the committed vendor/ tree is the build input; no sibling
 # clones or network module fetches are required.
    - go env -w GOMODCACHE="$CI_PROJECT_DIR/.gocache/mod" GOCACHE="$CI_PROJECT_DIR/.gocache" GOFLAGS="-mod=vendor" GOPROXY=off

lint:
  stage: lint
  script:
    - test -z "$(gofmt -l api cmd internal)" || (echo "gofmt düzeltmesi gerekiyor:" && gofmt -l api cmd internal && exit 1)
    - go vet ./...

test:
  stage: test
  script:
 # Unit tests run offline. envtest-backed tests require KUBEBUILDER_ASSETS;
 # without assets they skip (optional mode) and the full envtest gate runs
 # in the manual envtest job below. TestGoldenVerifyAllProfiles is a
 # cross-repo workspace proof that FAILS by design without sibling driver
 # checkouts (never skips); it is excluded from this standalone job and
 # runs in the manual golden-verify job below or in the multi-repo
 # workspace (docs/BUILDING.md "Offline test semantics").
    - QUARTET_TEST_ENVTEST=optional go test -count=1 -skip TestGoldenVerifyAllProfiles ./...

build:
  stage: build
  script:
    - go build -o bin/manager ./cmd/manager
  artifacts:
    paths:
      - bin/manager
    expire_in: 1 week

envtest:
  stage: envtest
 # The full envtest matrix needs versioned KUBEBUILDER_ASSETS on the runner.
 # Manual grant; offline lint/test/build above are the normal automatic gate.
  when: manual
  allow_failure: true
  timeout: 60 minutes
  script:
    - test -n "$KUBEBUILDER_ASSETS" || (echo "KUBEBUILDER_ASSETS is required" && exit 1)
    - QUARTET_TEST_ENVTEST=required go test -count=1 ./internal/controller/...

golden-verify:
  stage: envtest
 # Cross-repo regeneration-independence proof: re-render the
 # raw driver manifests with pinned kustomize v5.7.1 and field-compare against
 # the committed goldens. Requires sibling driver checkouts, so it is NOT part
 # of the standalone test job (the test fails by design when siblings are
 # absent). Manual grant. Branches/pins must stay in sync with the golden
 # headers (hack/verify-golden.sh FC_PIN/ISCSI_PIN defaults).
  when: manual
  allow_failure: false
  timeout: 30 minutes
  before_script:
    - go env -w GOMODCACHE="$CI_PROJECT_DIR/.gocache/mod" GOCACHE="$CI_PROJECT_DIR/.gocache"
    - mkdir -p .golden-workspace/CSI/Driver
    - git clone --quiet --branch feat/sdk-migration https://gitlab.ngxio.com/ngx-storage/integrations/container-storage/csi/driver/nfs.git .golden-workspace/CSI/Driver/NFS
    - git clone --quiet --branch master https://gitlab.ngxio.com/ngx-storage/integrations/container-storage/csi/driver/fc.git .golden-workspace/CSI/Driver/FC
    - git clone --quiet --branch v2.0.0 https://gitlab.ngxio.com/ngx-storage/integrations/container-storage/csi/driver/iscsi.git .golden-workspace/CSI/Driver/iSCSI
 # One online tool fetch populates the kustomize cache (outside go.mod/vendor).
    - go run sigs.k8s.io/kustomize/kustomize/v5@v5.7.1 version
  script:
    - export NFS_DIR="$CI_PROJECT_DIR/.golden-workspace/CSI/Driver/NFS"
    - export FC_DIR="$CI_PROJECT_DIR/.golden-workspace/CSI/Driver/FC"
    - export ISCSI_DIR="$CI_PROJECT_DIR/.golden-workspace/CSI/Driver/iSCSI"
    - go test -count=1 -v -run TestGoldenVerifyAllProfiles ./hack/rendertest