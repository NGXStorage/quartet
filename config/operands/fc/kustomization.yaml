# FC operand RBAC install set (out-of-band RBAC contract) — the GENERATED manifests
# in this directory are the installer's out-of-band surface, exactly like
# config/operands/nfs/: the Quartet manager holds ONLY get/list/watch on
# the four rbac.authorization.k8s.io kinds and never creates, patches,
# deletes or binds RBAC at runtime. The admin applies this set, and the
# reconciler verifies it by pinned name at reconcile start (Degraded/
# RBACDrift, retryable, until healthy) — operand apply is gated behind the
# verification.
#
# DO NOT hand-edit the generated YAML — regenerate with
# hack/generate-install-rbac (renderer.InstallRBAC; parity-pinned by
# internal/renderer). Each entrypoint overlay carries its own generated
# files (kustomize v5 locality forbids referencing files outside the
# overlay directory):
# k8s/{namespace.yaml,rbac.yaml} — kubernetes install set
# ocp/{namespace.yaml,rbac-ocp.yaml} — openshift install set (superset:
# adds the node SCC use grant)
# namespace.yaml is the operand namespace operand namespace (ngxstorage-fc), the FIRST
# document of every entrypoint; byte-identical across both overlays.
#
# Entrypoints (deterministic order: namespace → RBAC):
# kubectl apply -k config/operands/fc/k8s (make install-operands
# PLATFORM=k8s PROFILE=fc)
# kubectl apply -k config/operands/fc/ocp (make install-operands
# PLATFORM=ocp PROFILE=fc)
# The manager composition for this selection is a SEPARATE step:
# kubectl apply -k config/default-fc{,-ocp} — or the full-artifact path
# make install-artifacts PLATFORM=... PROFILE=fc.
#
# This parent kustomization selects the k8s entrypoint set (namespace →
# rbac.yaml) — the default selection, exactly like operands/nfs. The
# profile compositions reference the explicit entrypoints
# (operands/fc/{k8s,ocp} from config/default-fc{,-ocp}) and never mix
# platforms. kustomize v5's locality constraint forbids file references
# outside an overlay directory, so each entrypoint carries its OWN
# generated copies (the ocp namespace.yaml is byte-identical to the k8s
# one; both are parity-pinned).
resources:
- k8s
