# Kubernetes operand install entrypoint (explicit namespace contract). Apply with
# `make install-operands PLATFORM=k8s` or `kubectl apply -k config/operands/nfs/k8s`.
# Deterministic order (kustomize renders resources in listed order and
# kubectl applies the render sequentially): namespace → RBAC. The manager
# (config/default) is applied as a separate step.
#
# Files here are GENERATED (hack/generate-install-rbac); do not hand-edit.
# kustomize v5's locality constraint forbids referencing files outside this
# directory, so the overlay carries its own copies (parity-pinned against
# the renderer).
resources:
- namespace.yaml
- rbac.yaml
