apiVersion: v1
kind: ServiceAccount
metadata:
  name: quartet-manager
 # explicit placement: deterministic placement in quartet-system. Set explicitly (not via a
 # kustomize namespace transformer) so this file is correct even when applied
 # outside a kustomize build (individual apply, OLM/helm packaging) and the
 # render never depends on the kubectl default namespace.
  namespace: quartet-system
