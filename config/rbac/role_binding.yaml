# ClusterRoleBinding: the Quartet CRD is cluster-scoped (cluster-scoped CRD), so the
# manager needs a cluster-wide binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quartet-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quartet-manager-role
subjects:
- kind: ServiceAccount
  name: quartet-manager
  namespace: quartet-system
