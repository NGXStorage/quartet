  name: fc-csi-ngxstorage-node
  namespace: ngxstorage-fc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: node
      app.kubernetes.io/name: fc-csi-ngxstorage
  template:
    metadata:
      labels:
        app.kubernetes.io/component: node
        app.kubernetes.io/name: fc-csi-ngxstorage
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --csi-address=/csi/csi.sock
        - --kubelet-registration-path=/var/lib/kubelet/plugins/fc.csi.ngxstorage.com/csi.sock
        - --v=2
        image: quay.io/ngxstorage/csi-sidecars/csi-node-driver-registrar@sha256:f9de845b170155199f2a2a3f9531cf13d78e31235e9db6b6582a8b0db0a50dad
        imagePullPolicy: IfNotPresent
        name: node-driver-registrar
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /registration
          name: registration-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --health-port=9811
        image: quay.io/ngxstorage/csi-sidecars/livenessprobe@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
        imagePullPolicy: IfNotPresent
        name: liveness-probe
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --role=node
        - --endpoint=$(CSI_ENDPOINT)
        - --ip=$(STORAGE_IPS)
        - --pool-name=$(STORAGE_POOL_NAME)
        - --fc-target-names=$(FC_TARGET_NAMES)
        - --api-key=$(STORAGE_API_KEY)
        - --nodeid=$(KUBE_NODE_NAME)
        - --log=info
        env:
        - name: CSI_ENDPOINT
          value: unix:///csi/csi.sock
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NGX_COORDINATION_LEASE_PREFIX
          value: fc-csi-ngxstorage
        - name: NGX_COORDINATION_SHARD_COUNT
          value: '128'
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: STORAGE_IPS
          valueFrom:
            secretKeyRef:
              key: storage-ips
              name: fc-csi-ngxstorage-config
        - name: STORAGE_POOL_NAME
          valueFrom:
            secretKeyRef:
              key: pool-name
              name: fc-csi-ngxstorage-config
        - name: FC_TARGET_NAMES
          valueFrom:
            secretKeyRef:
              key: fc-target-names
              name: fc-csi-ngxstorage-config
        - name: STORAGE_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: fc-csi-ngxstorage-config
        - name: NGXSTORAGE_CSI_LOG_DIR
          value: /host/var/log/ngxstorage/fc
        image: quay.io/ngxstorage/fc-csi-ngxstorage@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 9811
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        name: fc-csi-ngxstorage
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
            - SYS_CHROOT
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /registration
          name: registration-dir
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access-ngxstorage
          readOnly: true
        - mountPath: /var/lib/kubelet
          mountPropagation: Bidirectional
          name: kubelet-dir
        - mountPath: /host
          mountPropagation: Bidirectional
          name: host-root
        - mountPath: /dev
          name: host-dev
      hostIPC: true
      hostNetwork: true
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/worker: ''
      priorityClassName: system-node-critical
      serviceAccountName: fc-csi-ngxstorage-node
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/kubelet/plugins/fc.csi.ngxstorage.com
          type: DirectoryOrCreate
        name: socket-dir
      - hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
        name: registration-dir
      - hostPath:
          path: /var/lib/kubelet
          type: Directory
        name: kubelet-dir
      - hostPath:
          path: /
          type: Directory
        name: host-root
      - hostPath:
          path: /dev
          type: Directory
        name: host-dev
      - name: kube-api-access-ngxstorage
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              items:
