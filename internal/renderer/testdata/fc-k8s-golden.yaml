apiVersion: v1
data:
  lease-prefix: fc-csi-ngxstorage
  shard-count: '128'
immutable: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: coordination-config
    app.kubernetes.io/name: fc-csi-ngxstorage
  name: fc-csi-ngxstorage-coordination-config
  namespace: ngxstorage-fc
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: controller-health
    app.kubernetes.io/name: fc-csi-ngxstorage
  name: fc-csi-ngxstorage-controller-health
  namespace: ngxstorage-fc
spec:
  ports:
  - name: healthz
    port: 9808
    targetPort: 9808
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: fc-csi-ngxstorage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: fc-csi-ngxstorage
  name: fc-csi-ngxstorage-controller
  namespace: ngxstorage-fc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: fc-csi-ngxstorage
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: fc-csi-ngxstorage
    spec:
      containers:
      - args:
        - --csi-address=/csi/csi.sock
        - --leader-election
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --timeout=300s
        - --v=2
        env:
        - name: POD_NAMESPACE
          valueFrom:
