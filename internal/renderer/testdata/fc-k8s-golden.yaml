# GOLDEN SOURCE: this fixture is a FIELD-LEVEL MIRROR of
# the upstream FC raw render -- NOT byte-identical to it. Approved transforms
# applied to the raw before comparison:
# StorageClass/VolumeSnapshotClass dropped (renderer never creates)
# driver env names canonicalized to the helm set: POOL_NAME ->
# STORAGE_POOL_NAME, API_KEY -> STORAGE_API_KEY (args $(...) refs and
# secretKeyRef names follow); secret name fc-csi-ngxstorage-secret ->
# fc-csi-ngxstorage-config (= the spec secretRef name parity test feeds)
# controller placement canonicalized to the ADOPTED free-placement
# default (the adopted default): the raw worker-pin is stripped from the
# controller Deployment ONLY (os=linux + tolerations retained); the
# node DS worker-pin stays (canonical for all three drivers).
# FC's live scheduling acceptance remains a separate live gate.
# --log=info stays UNQUOTED (raw already is; renderer writes spec.logLevel raw)
# driver digest -> parity reference (see fcGoldenDriverImage);
# sidecars stay renderer constants (digests identical across profiles)
# Everything else is SOURCE-BOUND raw adoption, including the recorded
# raw-vs-helm divergences (rawhelm diff, pinned Helm @ f9e3b35b): fsGroupPolicy
# File (fsGroupPolicy File open), node DS worker-pin on BOTH platforms (canonical),
# CSI_ENDPOINT env + raw arg order, --health-port livenessprobe flags,
# controller driver containerPort 9808 (no probe) vs node driver
# livenessProbe :9811, raw /registration driver mount, projected serviceaccount
# token volume (kube-api-access-ngxstorage) mounted only on the node driver
# container, IfNotPresent pull policy everywhere, kustomize SCC namespace
# artifact, capabilities order [SYS_ADMIN, SYS_CHROOT].
