  name: iscsi-csi-ngxstorage-controller-health
  namespace: ngxstorage-iscsi
spec:
  ports:
  - name: healthz
    port: 9808
    targetPort: 9808
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: iscsi-csi-ngxstorage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: iscsi-csi-ngxstorage
  name: iscsi-csi-ngxstorage-controller
  namespace: ngxstorage-iscsi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: iscsi-csi-ngxstorage
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: iscsi-csi-ngxstorage
    spec:
      containers:
      - args:
        - --csi-address=/csi/csi.sock
        - --leader-election
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --timeout=300s
        - --v=2
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/ngxstorage/csi-sidecars/csi-provisioner@sha256:a4b0b1a37605b7b04a293e136edf7006ec1786a8eb3f4e5a945f81d667dcc371
        imagePullPolicy: Always
        name: external-provisioner
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --leader-election
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --timeout=300s
        - --v=2
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/ngxstorage/csi-sidecars/csi-attacher@sha256:b9dc9a714a484ccdeeb6f86d88d4db9b7a5ecfc5a55da6db3a60bb3fa33c278a
        imagePullPolicy: Always
        name: external-attacher
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --leader-election
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --timeout=300s
        - --v=2
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/ngxstorage/csi-sidecars/csi-resizer@sha256:ea1d25e23479000c7e8eeb92d827df66258df4e482ca054c5e7ce3fc0f5c41a5
        imagePullPolicy: Always
        name: external-resizer
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --leader-election
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --timeout=300s
        - --v=2
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/ngxstorage/csi-sidecars/csi-snapshotter@sha256:42af0929bcd60a43499825c078a60ff0534e08af8fbeb283aa391be40feb9f3e
        imagePullPolicy: Always
        name: external-snapshotter
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --health-port=9808
        image: quay.io/ngxstorage/csi-sidecars/livenessprobe@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
        imagePullPolicy: Always
        name: liveness-probe
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --role=controller
        - --endpoint=$(CSI_ENDPOINT)
        - --ip=$(STORAGE_IPS)
        - --pool-name=$(STORAGE_POOL_NAME)
        - --portal-group=$(PORTAL_GROUP)
        - --api-key=$(STORAGE_API_KEY)
        - --log=info
        env:
        - name: CSI_ENDPOINT
          value: unix:///csi/csi.sock
        - name: NGX_COORDINATION_LEASE_PREFIX
          value: iscsi-csi-ngxstorage
        - name: NGX_COORDINATION_SHARD_COUNT
          value: '128'
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: STORAGE_IPS
          valueFrom:
            secretKeyRef:
              key: storage-ips
              name: iscsi-csi-ngxstorage-config
        - name: STORAGE_POOL_NAME
          valueFrom:
            secretKeyRef:
              key: pool-name
              name: iscsi-csi-ngxstorage-config
        - name: PORTAL_GROUP
          valueFrom:
            secretKeyRef:
              key: portal-group
              name: iscsi-csi-ngxstorage-config
        - name: STORAGE_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: iscsi-csi-ngxstorage-config
        image: quay.io/ngxstorage/iscsi-csi-ngxstorage@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        imagePullPolicy: Always
        name: iscsi-csi-ngxstorage
        ports:
        - containerPort: 9808
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      serviceAccountName: iscsi-csi-ngxstorage-controller
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - emptyDir: {}
        name: socket-dir
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: node
    app.kubernetes.io/name: iscsi-csi-ngxstorage
  name: iscsi-csi-ngxstorage-node
  namespace: ngxstorage-iscsi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: node
      app.kubernetes.io/name: iscsi-csi-ngxstorage
  template:
    metadata:
      annotations:
        openshift.io/required-scc: iscsi-csi-ngxstorage-node-scc
      labels:
        app.kubernetes.io/component: node
        app.kubernetes.io/name: iscsi-csi-ngxstorage
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --csi-address=/csi/csi.sock
        - --kubelet-registration-path=/var/lib/kubelet/plugins/iscsi.csi.ngxstorage.com/csi.sock
        - --v=2
        image: quay.io/ngxstorage/csi-sidecars/csi-node-driver-registrar@sha256:f9de845b170155199f2a2a3f9531cf13d78e31235e9db6b6582a8b0db0a50dad
        imagePullPolicy: Always
        name: node-driver-registrar
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /registration
          name: registration-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --health-port=9812
        image: quay.io/ngxstorage/csi-sidecars/livenessprobe@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
        imagePullPolicy: Always
        name: liveness-probe
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --role=node
        - --endpoint=$(CSI_ENDPOINT)
        - --ip=$(STORAGE_IPS)
        - --pool-name=$(STORAGE_POOL_NAME)
        - --portal-group=$(PORTAL_GROUP)
        - --api-key=$(STORAGE_API_KEY)
        - --nodeid=$(KUBE_NODE_NAME)
        - --log=info
        env:
        - name: CSI_ENDPOINT
          value: unix:///csi/csi.sock
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NGX_COORDINATION_LEASE_PREFIX
          value: iscsi-csi-ngxstorage
        - name: NGX_COORDINATION_SHARD_COUNT
          value: '128'
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: STORAGE_IPS
          valueFrom:
            secretKeyRef:
              key: storage-ips
              name: iscsi-csi-ngxstorage-config
        - name: STORAGE_POOL_NAME
          valueFrom:
            secretKeyRef:
              key: pool-name
              name: iscsi-csi-ngxstorage-config
        - name: PORTAL_GROUP
          valueFrom:
            secretKeyRef:
              key: portal-group
              name: iscsi-csi-ngxstorage-config
        - name: STORAGE_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: iscsi-csi-ngxstorage-config
        - name: NGXSTORAGE_CSI_LOG_DIR
          value: /host/var/log/ngxstorage/iscsi
        image: quay.io/ngxstorage/iscsi-csi-ngxstorage@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 9812
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        name: iscsi-csi-ngxstorage
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
            - SYS_CHROOT
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /registration
          name: registration-dir
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access-ngxstorage
          readOnly: true
        - mountPath: /var/lib/kubelet
          mountPropagation: Bidirectional
          name: kubelet-dir
        - mountPath: /host
          mountPropagation: Bidirectional
          name: host-root
        - mountPath: /dev
          name: host-dev
      hostIPC: true
      hostNetwork: true
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/worker: ''
      priorityClassName: system-node-critical
      serviceAccountName: iscsi-csi-ngxstorage-node
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/kubelet/plugins/iscsi.csi.ngxstorage.com
          type: DirectoryOrCreate
        name: socket-dir
      - hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
        name: registration-dir
      - hostPath:
          path: /var/lib/kubelet
          type: Directory
        name: kubelet-dir
      - hostPath:
          path: /
          type: Directory
        name: host-root
      - hostPath:
          path: /dev
          type: Directory
        name: host-dev
      - name: kube-api-access-ngxstorage
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
