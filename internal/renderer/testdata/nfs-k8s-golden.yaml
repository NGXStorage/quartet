        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 9809
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        name: nfs-csi-ngxstorage
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_CHROOT
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /csi
