              fieldPath: spec.nodeName
        - name: STORAGE_IPS
          valueFrom:
            secretKeyRef:
              key: storage-ips
              name: nfs-csi-ngxstorage-config
        - name: STORAGE_POOL_NAME
          valueFrom:
            secretKeyRef:
              key: pool-name
